name: Unpack project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o 'local-llm-chat.zip' -d /tmp/proj
          cp -r /tmp/proj/local-llm-chat/local-llm-chat/ . .
          rm -f 'local-llm-chat/local-llm-chat.zip'
      - name: Commit
        run: |
          git config user.name "nightlais22"
          git config user.email "nightlais22@users.noreply.github.com"
          git checkout -- .github/workflows/
          git add -A
          git commit -m "unpack project" || echo "nothing to commit"
          git push
