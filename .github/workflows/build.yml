name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: unzip -o "Чужое3.zip" -d work

      - name: Setup Gradle wrapper
        working-directory: work
        run: gradle wrapper --gradle-version 8.13

      - name: Make gradlew executable
        working-directory: work
        run: chmod +x gradlew

      - name: Download ai-core AAR
        working-directory: work
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/ai-core-release.aar "https://github.com/Siddhesh2377/Ai-Core/releases/download/v0.1/ai-core-release.aar"

      - name: Build APK
        working-directory: work
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: work/**/app-debug.apk
