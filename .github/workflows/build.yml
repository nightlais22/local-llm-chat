name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          unzip -o "local-llm-chat.zip" -d work
          if [ -d "work/local-llm-chat/local-llm-chat" ]; then
            mv work/local-llm-chat/local-llm-chat work/project
          else
            mv work/local-llm-chat work/project
          fi

      - name: Setup Gradle wrapper
        working-directory: work/project
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        working-directory: work/project
        run: chmod +x gradlew

      - name: Build APK
        working-directory: work/project
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: work/project/**/app-debug.apk
